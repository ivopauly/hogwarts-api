# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  # Maintain dependencies for npm (node modules)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # vue-tsc still require.resolve()s `typescript/lib/tsc`, which TypeScript 7
      # removed, so `npm run typecheck` dies with ERR_PACKAGE_PATH_NOT_EXPORTED.
      # Verified against vue-tsc 3.3.10 — its peer range claims ">=5.0.0" but the
      # implementation has not caught up. Revisit when vue-tsc drops the lib/tsc
      # lookup; until then major bumps here only produce a broken typecheck.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
